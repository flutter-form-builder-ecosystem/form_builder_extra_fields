name: form_builder_extra_fields
description: Additional ready-made form input fields for flutter_form_builder package
version: 13.0.0
homepage: https://github.com/flutter-form-builder-ecosystem
repository: https://github.com/flutter-form-builder-ecosystem/form_builder_extra_fields
issue_tracker: https://github.com/flutter-form-builder-ecosystem/form_builder_extra_fields/issues
topics:
  - form
funding:
  - https://opencollective.com/flutter-form-builder-ecosystem
screenshots:
  - description: Extra fields together — searchable dropdown, color picker, touch spin, rating bar, and signature pad.
    path: screenshots/complete_form.gif
  - description: Color picker fields with material and block picker swatches.
    path: screenshots/color_picker.gif
  - description: Rating bar with whole-star and half-star values.
    path: screenshots/rating_bar.gif
  - description: Searchable dropdown selecting a country from a local list.
    path: screenshots/searchable.gif

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_form_builder: ^11.0.0
  material_ui: ^1.0.0
  flutter_colorpicker: ^1.1.0
  dropdown_search: ^7.0.0
  signature: ^6.4.0
  # This version would be max, the same version used on flutter_localizations
  # https://github.com/flutter/flutter/blob/stable/packages/flutter_localizations/pubspec.yaml
  intl: ">=0.20.0 <0.21.0"
  flutter_typeahead: ^6.0.0
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_lints: ">=6.0.0"
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
